<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify code — Chase Staples</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="brand">Chase<em>.</em>Staples</a>
    <ul class="nav-links">
      <li><a href="login.html">Back to sign in</a></li>
    </ul>
  </nav>
</header>

<div class="auth-shell">
  <div class="panel auth-card">
    <div class="br-bl"></div><div class="br-br"></div>
    <a href="login.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
    <span class="auth-badge">STEP 2 · VERIFICATION</span>
    <h1>Enter your code</h1>
    <p class="sub">We "texted" a 4-digit code to <strong id="destEmail">your account</strong>.</p>

    <div class="otp-deck" id="otpDeck">
      <div class="otp-slot"><input inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1"></div>
      <div class="otp-slot"><input inputmode="numeric" maxlength="1" aria-label="Digit 2"></div>
      <div class="otp-slot"><input inputmode="numeric" maxlength="1" aria-label="Digit 3"></div>
      <div class="otp-slot"><input inputmode="numeric" maxlength="1" aria-label="Digit 4"></div>
      <div class="otp-success-card" id="successCard" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6"/></svg>
      </div>
    </div>

    <p class="auth-error" id="otpError">That code doesn't match. Try again.</p>

    <p class="otp-resend">Didn't get a code? <button type="button" id="resendBtn">Resend</button></p>

    <p class="auth-note">Demo mode — type, paste, or autofill the code, then hit Enter. The working code is <b>1234</b>.</p>
  </div>
</div>

<script>
const email = sessionStorage.getItem('demoEmail');
if(email){
  document.getElementById('destEmail').textContent = email;
} else {
  // no login step happened — send back
  window.location.href = 'login.html';
}

const slots = Array.from(document.querySelectorAll('.otp-slot'));
const inputs = slots.map(s => s.querySelector('input'));
const deck = document.getElementById('otpDeck');
const err = document.getElementById('otpError');
const CODE = '1234';

function currentValue(){
  return inputs.map(i => i.value).join('');
}

const successCard = document.getElementById('successCard');

function checkComplete(){
  if(currentValue().length === 4){
    if(currentValue() === CODE){
      err.classList.remove('show');
      inputs.forEach(i => i.disabled = true);
      sessionStorage.setItem('loggedIn', 'true');

      // 1. cards converge into a stack
      deck.classList.add('stacked');

      // 2. stack fades out as the success card scales in with a drawn checkmark
      setTimeout(() => {
        deck.classList.add('merged');
        successCard.classList.add('show');
      }, 460);

      // 3. hand off to the portfolio page
      setTimeout(() => { window.location.href = 'index.html'; }, 1500);
    } else {
      err.classList.add('show');
    }
  }
}

inputs.forEach((input, idx) => {
  input.addEventListener('input', () => {
    input.value = input.value.replace(/[^0-9]/g,'').slice(0,1);
    slots[idx].classList.toggle('filled', input.value.length === 1);
    if(input.value && idx < inputs.length - 1){
      inputs[idx+1].focus();
    }
    err.classList.remove('show');
    checkComplete();
  });

  input.addEventListener('keydown', (e) => {
    if(e.key === 'Backspace' && !input.value && idx > 0){
      inputs[idx-1].focus();
    }
    if(e.key === 'Enter'){
      checkComplete();
    }
  });

  input.addEventListener('paste', (e) => {
    e.preventDefault();
    const digits = (e.clipboardData.getData('text') || '').replace(/[^0-9]/g,'').slice(0,4).split('');
    digits.forEach((d, i) => {
      if(inputs[i]){
        inputs[i].value = d;
        slots[i].classList.add('filled');
      }
    });
    const next = inputs[digits.length] || inputs[inputs.length-1];
    next.focus();
    checkComplete();
  });
});

inputs[0].focus();

let resendCooldown = 0;
const resendBtn = document.getElementById('resendBtn');
resendBtn.addEventListener('click', () => {
  resendCooldown = 20;
  resendBtn.disabled = true;
  const tick = () => {
    if(resendCooldown > 0){
      resendBtn.textContent = `Resend (${resendCooldown}s)`;
      resendCooldown--;
      setTimeout(tick, 1000);
    } else {
      resendBtn.textContent = 'Resend';
      resendBtn.disabled = false;
    }
  };
  tick();
});
</script>
</body>
</html>
